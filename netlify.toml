# Netlify build settings. These override whatever is set in the Netlify UI.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"

# The Next.js adapter turns the .next build output into something Netlify can
# serve (pages, server actions, image optimization). It's declared explicitly
# because the previous deploy skipped it and published raw .next files, which
# made every route return 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
